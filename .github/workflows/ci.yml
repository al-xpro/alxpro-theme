name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Build, and fail if themes/ isn't what the palette generates
        run: |
          npm run build
          git diff --exit-code -- themes/
      - run: npm run check
      - name: Package the extension
        run: mkdir -p dist && npx vsce package --no-dependencies --out dist/
