# Runs on every pull request, and publishes on a version tag.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  NODE_VERSION: 24
  FORCE_COLOR: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the themes and fail if they changed
        run: |
          pnpm build
          git diff --exit-code
      - run: pnpm test
        if: ${{ !cancelled() }}
        continue-on-error: false
