<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme preview &mdash; HTML</title>
    <link rel="stylesheet" href="/globals.css" />
    <style>
      body {
        margin: 0;
        font-family: var(--font-sans);
      }
    </style>
  </head>
  <body class="dark">
    <!-- Header with navigation -->
    <header id="top" data-sticky>
      <nav aria-label="Main">
        <a href="/" aria-current="page">Home</a>
        <a href="/docs?ref=nav#install">Docs</a>
      </nav>
    </header>
    <main id="main">
      <form action="/api/subscribe" method="post" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required placeholder="you@example.com" />
        <button type="submit" disabled>Subscribe</button>
      </form>
      <img src="/hero.png" alt="" width="1200" height="630" loading="lazy" />
    </main>
    <script type="module">
      const form = document.querySelector("form");
      form?.addEventListener("submit", (event) => {
        event.preventDefault();
        console.log(new FormData(form).get("email"));
      });
    </script>
  </body>
</html>
